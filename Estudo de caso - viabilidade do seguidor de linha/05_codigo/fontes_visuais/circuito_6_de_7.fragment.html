  <script>
  (()=>{
    const root=document.getElementById('trif-gap8-one-6');
    const D=JSON.parse(root.querySelector('[data-source="lap"]').textContent),F=D.frames,E=D.events,G=D.geometry,C=D.config;
    const svg=root.querySelector('.lap-scene'),slider=root.querySelector('[data-control="progress"]'),follow=root.querySelector('[data-control="follow"]'),choice=root.querySelector('[data-control="mark"]'),play=root.querySelector('[data-action="play"]'),detail=root.querySelector('[data-readout="detail"]');
    const total=F[F.length-1][0],lastFinish=E.find(e=>e.kind==='chegada');
    const fmt=(x,n=1)=>Number(x).toLocaleString('pt-BR',{minimumFractionDigits:n,maximumFractionDigits:n});
    root.querySelector('[data-fixed="geometry"]').textContent='Vão '+fmt(C.gap_mm)+' mm · QRE +1 mm · L '+fmt(C.L_mm)+' mm';
    root.querySelector('[data-fixed="result"]').textContent=D.summary.read+'/'+E.length+' marcas cobertas · '+D.summary.common_tolerance_read+'/'+E.length+' na região comum às tolerâncias';
    choice.innerHTML+='<optgroup label="Passagens calculadas">'+E.map(e=>'<option value="'+e.id+'">'+e.label+' · '+(e.read?'coberta':'PERDIDA')+' · Δ '+(e.centre_error_mm===null?'sem cruzamento':fmt(e.centre_error_mm)+' mm')+'</option>').join('')+'</optgroup>';
    let state={fraction:0.3150103675185077,follow:true,selected:2},raf=null,paused=false,detailKey='';
    function poseAt(s){let lo=0,hi=F.length-1;while(lo+1<hi){const mid=(lo+hi)>>1;if(F[mid][0]<=s)lo=mid;else hi=mid;}const f=Math.max(0,Math.min(1,(s-F[lo][0])/(F[hi][0]-F[lo][0])));return F[lo].map((v,j)=>v+f*(F[hi][j]-v));}
    function bodyPoint(p,x,y){const a=p[3],d=y-G.axle_y-C.L_mm;return [p[1]+d*Math.cos(a)+x*Math.sin(a),p[2]+d*Math.sin(a)-x*Math.cos(a)];}
    const leftTrail=F.map(p=>bodyPoint(p,-C.side_sensor_offset_mm,C.sensor_y_mm));
    const rightTrail=F.map(p=>bodyPoint(p,C.side_sensor_offset_mm,C.sensor_y_mm));
    function saved(){if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{simulation_id:D.id,geometry_revision:2,gap_mm:C.gap_mm,L_mm:C.L_mm,selected_mark:state.selected>=0?E[state.selected].label:null,progress_percent:Math.round(state.fraction*10000)/100},privateContent:{...state}}).catch(()=>{});}
    function stop(){if(raf)cancelAnimationFrame(raf);raf=null;play.textContent='Simular volta';}
    function selectedEvent(s){return state.selected>=0?E[state.selected]:E.reduce((best,e)=>Math.abs(e.display_s-s)<Math.abs(best.display_s-s)?e:best,E[0]);}
    function draw(){
      const s=state.fraction*total,p=poseAt(s),W=Math.max(290,svg.getBoundingClientRect().width),H=460;
      slider.value=state.fraction*100;follow.checked=state.follow;choice.value=state.selected;
      const courseSpan=D.checks.start_to_finish_mm,elapsed=Math.max(0,Math.min(courseSpan,s-E[0].centre_plane_s));
      root.querySelector('[data-readout="progress"]').textContent=fmt(state.fraction*100,1)+'% · '+fmt(s/1000,2)+' m de avanço da barra';
      svg.setAttribute('viewBox','0 0 '+W+' '+H);
      const B=D.bounds;const centre=state.follow?[p[1]-C.L_mm*.45*Math.cos(p[3]),p[2]-C.L_mm*.45*Math.sin(p[3])]:[(B[0]+B[2])/2,(B[1]+B[3])/2];
      const scale=state.follow?Math.min((W-25)/340,(H-55)/310):Math.min((W-35)/(B[2]-B[0]),(H-70)/(B[3]-B[1]));
      const screen=q=>[W/2+(q[0]-centre[0])*scale,H/2-(q[1]-centre[1])*scale];
      const pt=q=>screen(q).join(',');const points=qs=>qs.map(pt).join(' ');
      const line=(a,b,color,width=1,extra='')=>{const x=screen(a),y=screen(b);return '<line x1="'+x[0]+'" y1="'+x[1]+'" x2="'+y[0]+'" y2="'+y[1]+'" stroke="'+color+'" stroke-width="'+width+'" '+extra+'/>';};
      const event=selectedEvent(s);
      let out='<title>Simulação cinemática em circuito de teste</title><desc>Sensor esquerdo nas mudanças de curvatura, direito na partida e chegada. A barra frontal segue idealmente o centro da linha. A cor e o símbolo de cada marca indicam interseção calculada.</desc><defs><clipPath id="trif-gap8-one-6-clip"><rect x="0" y="0" width="'+W+'" height="'+(H-35)+'"/></clipPath></defs><g clip-path="url(#trif-gap8-one-6-clip)">';
      out+='<polyline points="'+points(D.course)+'" fill="none" stroke="var(--foreground)" stroke-opacity=".17" stroke-width="'+Math.max(1.5,19*scale)+'"/>';
      out+='<polyline points="'+points(leftTrail)+'" fill="none" stroke="var(--viz-series-1)" stroke-opacity=".65" stroke-width="1.2"/>';
      out+='<polyline points="'+points(rightTrail)+'" fill="none" stroke="var(--viz-series-2)" stroke-opacity=".55" stroke-width="1.2"/>';
      for(const e of E){
        const co=Math.cos(e.phi),si=Math.sin(e.phi),world=(u,v)=>[e.x+co*u-si*v*e.side,e.y+si*u+co*v*e.side];
        const marker=[[9.5,49.5],[9.5,89.5],[-9.5,89.5],[-9.5,49.5]].map(q=>world(q[0],q[1]));
        out+='<polygon points="'+points(marker)+'" fill="'+(e.read?'var(--foreground)':'var(--viz-series-3)')+'" fill-opacity="'+(e.read?'.28':'.5')+'"/>';
        const centreMark=world(0,69.5),sc=screen(centreMark);
        out+=line(world(-3,69.5),world(3,69.5),'var(--foreground)',1)+line(world(0,66.5),world(0,72.5),'var(--foreground)',1);
        if(!e.read){out+='<path d="M '+(sc[0]-3)+' '+(sc[1]-3)+' L '+(sc[0]+3)+' '+(sc[1]+3)+' M '+(sc[0]+3)+' '+(sc[1]-3)+' L '+(sc[0]-3)+' '+(sc[1]+3)+'" fill="none" stroke="var(--viz-series-3)" stroke-width="2"/>';}
        if(e.id===event.id&&state.follow){out+='<text x="'+Math.max(5,Math.min(W-105,sc[0]+8))+'" y="'+Math.max(20,Math.min(H-55,sc[1]-12))+'">'+e.label+'</text>';}
        if(!state.follow&&e.kind!=='curva')out+='<text x="'+sc[0]+'" y="'+(sc[1]+23)+'" text-anchor="middle">'+e.label+'</text>';
      }
      // PCB and the actual V1 sensor positions; supports are schematic in plan.
      for(const seg of G.outline_segments)out+=line(bodyPoint(p,seg[0],seg[1]),bodyPoint(p,seg[2],seg[3]),'var(--foreground)',state.follow?1.3:.8);
      for(const b of G.motor_blocks){const q=[[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]]].map(q=>bodyPoint(p,q[0],q[1]));out+='<polygon points="'+points(q)+'" fill="var(--foreground)" fill-opacity=".08"/>';}
      for(const hull of G.wheel_hulls||[]){out+='<polygon points="'+points(hull.map(q=>bodyPoint(p,q[0],q[1])))+'" fill="var(--foreground)" fill-opacity=".22" stroke="var(--foreground)" stroke-width=".8"/>';}
      for(const x of [-1,1])out+=line(bodyPoint(p,x*43.75,10.75),bodyPoint(p,x*44.62624,G.bar_translation-3.68496),'var(--foreground)',state.follow?1:.6);
      const front=G.front_sensor_centres.map(q=>bodyPoint(p,q[0],q[1]+G.bar_translation));
      out+='<polyline points="'+points(front)+'" fill="none" stroke="var(--foreground)" stroke-width="'+(state.follow?2:1)+'"/>';
      if(state.follow)for(const q of front){const t=screen(q);out+='<circle cx="'+t[0]+'" cy="'+t[1]+'" r="1.7" fill="var(--foreground)"/>';}
      out+=line(bodyPoint(p,-59,G.axle_y),bodyPoint(p,59,G.axle_y),'var(--foreground)',1,'stroke-dasharray="4 3"');
      for(const [x,color] of [[-69.5,'var(--viz-series-1)'],[69.5,'var(--viz-series-2)']]){const q=screen(bodyPoint(p,x,C.sensor_y_mm));out+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(state.follow?4:2)+'" fill="var(--background)" stroke="'+color+'" stroke-width="2"/>';}
      if(state.follow&&Math.abs(s-event.display_s)<2){const target=bodyPoint(p,event.side>0?-69.5:69.5,C.sensor_y_mm),q=[event.x-Math.sin(event.phi)*event.side*69.5,event.y+Math.cos(event.phi)*event.side*69.5];out+=line(target,q,'var(--viz-series-3)',1,'stroke-dasharray="3 3"');}
      out+='</g>';
      const barLength=state.follow?50:500,barPixels=barLength*scale;
      out+='<line x1="15" y1="'+(H-23)+'" x2="'+(15+barPixels)+'" y2="'+(H-23)+'" stroke="var(--foreground)"/>';
      out+='<text x="15" y="'+(H-5)+'">'+barLength+' mm</text>';
      if(state.follow){const mw=Math.min(155,W*.31),mh=Math.max(50,Math.min(105,mw*(B[3]-B[1])/(B[2]-B[0]))),mx=W-mw-6,my=8,ms=Math.min((mw-8)/(B[2]-B[0]),(mh-8)/(B[3]-B[1]));const mini=q=>[mx+mw/2+(q[0]-(B[0]+B[2])/2)*ms,my+mh/2-(q[1]-(B[1]+B[3])/2)*ms];out+='<rect x="'+mx+'" y="'+my+'" width="'+mw+'" height="'+mh+'" fill="var(--background)" fill-opacity=".9"/><polyline points="'+D.course.map(q=>mini(q).join(',')).join(' ')+'" fill="none" stroke="var(--foreground)" stroke-opacity=".55" stroke-width="1"/>';const q=mini([p[1],p[2]]);out+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3" fill="var(--viz-series-1)"/>';}
      svg.innerHTML=out;
      const target=bodyPoint(p,event.side>0?-69.5:69.5,C.sensor_y_mm),dx=target[0]-event.x,dy=target[1]-event.y;
      const u=dx*Math.cos(event.phi)+dy*Math.sin(event.phi),v=event.side*(-dx*Math.sin(event.phi)+dy*Math.cos(event.phi));
      const on=Math.abs(u)<=9.5&&v>=49.5&&v<=89.5;
      const key=event.id+'-'+state.selected+'-'+on;
      if(detailKey!==key||!raf){detail.textContent=event.label+' · '+(event.read?'passagem tocou a marca':'passagem PERDEU a marca')+' · agora '+(on?'dentro':'fora')+' · desvio no plano médio '+(event.centre_error_mm===null?'sem cruzamento':fmt(event.centre_error_mm)+' mm');detailKey=key;}
      root.dataset.progress=state.fraction.toFixed(5);root.dataset.mark=event.label;
    }
    play.addEventListener('click',()=>{
      if(raf){stop();paused=true;play.textContent='Retomar';saved();return;}
      if(matchMedia('(prefers-reduced-motion: reduce)').matches){state.fraction=1;state.follow=false;state.selected=-1;draw();saved();return;}
      if(!paused)state.fraction=0;paused=false;state.selected=-1;state.follow=true;
      const start=performance.now(),from=state.fraction;play.textContent='Pausar';
      function tick(now){state.fraction=Math.min(1,from+(now-start)/35000);draw();if(state.fraction<1)raf=requestAnimationFrame(tick);else{stop();state.follow=false;draw();saved();}}raf=requestAnimationFrame(tick);
    });
    root.querySelector('[data-action="begin"]').addEventListener('click',()=>{stop();paused=false;state.fraction=0;state.selected=-1;draw();saved();});
    root.querySelector('[data-action="next"]').addEventListener('click',()=>{stop();paused=false;const e=E.find(e=>e.display_s>state.fraction*total+1)||E[0];state.fraction=e.display_s/total;state.selected=e.id;state.follow=true;draw();saved();});
    slider.addEventListener('input',()=>{stop();paused=false;state.fraction=Number(slider.value)/100;state.selected=-1;draw();saved();});
    follow.addEventListener('change',()=>{state.follow=follow.checked;draw();saved();});
    choice.addEventListener('change',()=>{stop();paused=false;state.selected=Number(choice.value);if(state.selected>=0){state.fraction=E[state.selected].display_s/total;state.follow=true;}else state.follow=false;draw();saved();});
    function restore(v){const q=v&&v.privateContent;if(q&&v.modelContent&&v.modelContent.simulation_id===D.id){if(Number.isFinite(q.fraction))state.fraction=Math.max(0,Math.min(1,q.fraction));if(typeof q.follow==='boolean')state.follow=q.follow;if(Number.isInteger(q.selected)&&q.selected>=-1&&q.selected<E.length)state.selected=q.selected;}draw();}
    new ResizeObserver(draw).observe(svg);
    window.addEventListener('openai:set_globals',e=>{if(e.detail&&e.detail.globals&&e.detail.globals.widgetState)restore(e.detail.globals.widgetState);});
    restore(window.openai&&window.openai.widgetState);
  })();
